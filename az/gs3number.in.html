<h1>Sibionics hesab identifikatoru</h1>
<p>Tətbiq sensora yalnız əvvəllər istifadə olunmuş eyni hesab identifikatoru (ID) ilə qoşula bilər. Sensor Sibionics GS3 tətbiqində istifadə olunubsa, bu ID-ni onların serverindən əldə edə bilərsiniz.</p>
