<body dir="ltr" lang="ko-KR"><h1 class="western">혈당 측정기</h1>
<p style="line-height: 100%; margin-bottom: 0cm">Juggluco는 지정한 <b>날짜</b>
와 <b>시간</b>보다 타임스탬프가 늦은 혈당값만 추가합니다. 이전 혈당값이 이미 Juggluco에 있다면 더 늦은 날짜와 시간으로 변경하십시오.</p>
<p style="line-height: 100%; margin-bottom: 0cm">
<b>혈당</b>용 레이블을 선택하십시오.</p>
<p style="line-height: 100%; margin-bottom: 0cm">처음에는 혈당 측정기를 페어링 모드로 전환해야 합니다. 예를 들어 전원이 꺼진 측정기의 버튼을 파란 불이 깜박일 때까지 길게 누릅니다.</p>
<p><b>삭제</b>: Juggluco에서 이 혈당 측정기에 대한 정보를 제거하여 혈당 측정기 목록에 더 이상 표시되지 않게 합니다. 측정기에서 받은 데이터는 그대로 남습니다.</p>
