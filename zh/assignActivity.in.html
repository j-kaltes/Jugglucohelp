<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="utf-8">
<title>根据活动创建数值</title>
</head>
<body>
<h1>根据活动创建数值</h1>
<p>设置如何根据从 Health Connect 收到的活动，在特定标签下创建数值。</p>
<p>此页面首先显示相应的 Health Connect 活动类型。选择在 Juggluco 中用于保存数值的标签，或者创建一个 <i>新建标签</i>。</p>
<p>选择要在该标签下保存的活动指标。</p>
<p><b>舍入到：</b> 指定舍入步长：设为 1 时只显示整数；设为 0.1 时显示一位小数，依此类推。</p>
<p><b>同时修改以前自动创建的数值</b>: 启用此选项后，以前自动生成的所有数值都会按新设置更新。如果未启用，新设置仅适用于之后新增活动生成的数值。</p>
</body>
</html>
