<body dir="rtl" lang="ar"><p>اضبط «Give amounts» لإتاحة الكميات عبر خادم Nightscout في Juggluco. قبل أن تتمكن من تشغيل «Give amounts»، يجب أن تحدد لكل تسمية كيف ينبغي إتاحة الكميات المُدخلة تحت هذه التسمية. ويمكن إنشاء التسميات نفسها وتعديلها وحذفها من القائمة اليسرى ← الإعدادات ← «Number Labels».</p>
