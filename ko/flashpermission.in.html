<body dir="ltr" lang="ko-KR"><p style="line-height: 100%; margin-bottom: 0in">
일부 스마트폰에서는 플래시를 사용하려면 카메라 권한이 필요하다는 주장이 있습니다. 그래서 이전 버전의 Juggluco에서는 이 권한을 요청했습니다. 시험한 휴대전화에서는 이 권한이 필요하지 않았기 때문에 이제 Juggluco는 요청하지 않습니다. 플래시가 작동하지 않거나 플래시 사용 시 스마트폰이 충돌하거나 이상하게 동작한다면 카메라 권한을 켜 보십시오.</p>
<p style="line-height: 100%; margin-bottom: 0in">Juggluco의 Android 설정에서 다시 끌 수 있습니다.</p>
<p style="line-height: 100%; margin-bottom: 0in"><br/>
