<body dir="rtl" lang="fa-IR"><h1>هشدارها</h1><p>در این صفحه هشدارهای برنامهٔ Libre 3 Kerfstok برای ساعت Garmin را تنظیم می‌کنید: هشدار افت گلوکز، افزایش گلوکز و قطع سیگنال (وقتی ساعت تا چند دقیقه مقدار تازه‌ای دریافت نکند). پس از زدن «ذخیره»، تنظیمات به ساعت فرستاده می‌شوند. جزئیات هر هشدار را در «هشدار» تعیین کنید.</p></body>
