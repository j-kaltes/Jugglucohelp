<p>تُستخدم <b>الجداول</b> لتفعيل ملف تعريف معيّن في وقت معيّن من اليوم.</p>
<p>اضغط <b>جديد</b> لإنشاء ربط بين وقت معيّن وملف تعريف. سيبدّل Juggluco يوميًا إلى هذا الملف في الوقت المحدد.</p>
<p>جميع إعدادات <b>التنبيهات</b> و<b>النطق</b> مرتبطة بملف التعريف النشط. ويمكن رؤية الملف النشط من صفحات التنبيهات والنطق.</p>
