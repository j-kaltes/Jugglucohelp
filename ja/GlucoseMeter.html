<p style="line-height: 100%; margin-bottom: 0cm">Jugglucoは指定した日時より新しいタイムスタンプを持つ血糖値のみを追加します。Jugglucoにそれ以前の血糖値がすでに存在する場合は、より新しい日時に変更してください。</p>
