<body lang="ja" dir="ltr"><h1><i>血糖値</i>書き込み権限</h1>
<p><b>Health Connect</b> へ血糖値を書き込めるようにするには、Jugglucoに <b>血糖値</b> をHealth Connectへ書き込む権限を付与する必要があります。
</p>
<p>この権限はHealth Connectでの血糖値受信以外には使用されません。それ以外のすべての機能は、この権限がなくても動作します。</p>
