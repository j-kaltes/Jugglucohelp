<body lang="ja" dir="ltr"><h1>色</h1>
<p>ここでは数値、曲線、スキャン点の色を変更できます。曲線上の点、スキャン点、または記録をタッチして(その点や記録の情報が表示された状態にします)、続けて色表示の中の色をタッチしてください。曲線、スキャン点、記録がその色で表示されます。</p>
<p>WearOS版では戻るキーのあるウォッチが必要です。スワイプによる戻る操作では機能しません。</p>
