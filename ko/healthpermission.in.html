<body dir="ltr" lang="ko-KR"><h1>혈당 쓰기 권한 <i>혈당</i></h1>
<p>혈당값을 <b>Health Connect에</b> 기록하려면 사용자가 Juggluco에 <b>혈당</b>
을 Health Connect에 기록할 권한을 부여해야 합니다. 
</p>
<p>이 권한은 Health Connect에서 혈당값을 받게 하는 용도 외에는 필요하지 않습니다. 그 밖의 모든 기능은 이 권한 없이도 Juggluco가 사용할 수 있습니다.</p>
