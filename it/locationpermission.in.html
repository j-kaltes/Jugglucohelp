<body lang="it-IT" dir="ltr"><h1>Permesso di posizione</h1>
<p style="margin-bottom: 0in">I dispositivi che eseguono da Android 6
ad Android 11 hanno bisogno del permesso di posizione per trovare i
dispositivi Bluetooth. Questa scansione di dispositivi Bluetooth è
necessaria per <b>Sibionics</b>, <b>Aidex X</b> e <b>Dexcom </b>ed
è usata anche da Juggluco su Android 6, 7 e 7.1</p>
