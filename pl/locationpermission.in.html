<body lang="pl-PL" dir="ltr"><h1>Uprawnienie do danych lokalizacji</h1>
<p style="margin-bottom: 0in">Urządzenia z systemem Android od 6 do 11 potrzebują uprawnień do danych lokalizacji, aby odnaleźć urządzenia Bluetooth. Ten skaner dla urządzeń Bluetooth jest wymagany dla sensor&oacute;w <b>Sibionics</b> i <b>Dexcom </b>i jest r&oacute;wnież używany przez Juggluco na Androidzie 6, 7 i 7.1.</p>
