<body dir="ltr" lang="ko-KR"><h1>위치 권한</h1>
<p style="margin-bottom: 0in">Android 6~11을 실행하는 기기는 Bluetooth 기기를 찾기 위해 위치 권한이 필요합니다. Bluetooth 기기 검색은 <b>Sibionics</b>, <b>Aidex X</b> 및 <b>Dexcom </b>에 필요하며 Android 6, 7 및 7.1의 Juggluco에서도 사용됩니다.</p>
