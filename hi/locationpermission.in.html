<body lang="hi-IN" dir="ltr"><h1>स्थान अनुमति</h1>
<p style="margin-bottom: 0in">Android 6 से 11 चलाने वाले डिवाइसों को
ब्लूटूथ डिवाइस खोजने के लिए स्थान अनुमति की आवश्यकता होती है।
ब्लूटूथ डिवाइसों के लिए यह स्कैन <b>Sibionics</b> और <b>Dexcom</b>
के लिए आवश्यक है और Juggluco द्वारा Android 6, 7 और 7.1 पर भी उपयोग
किया जाता है।</p>
