<body lang="ja" dir="ltr"><p style="line-height: 100%; margin-bottom: 0in">
一部のスマートフォンでは、フラッシュライトの使用にカメラ権限が必要だと言われることがあります。そのため以前のバージョンのJugglucoはこの権限を要求していました。テストしたスマートフォンではこの権限は不要だったため、現在のJugglucoは要求しません。フラッシュが動作しなかったり、フラッシュ使用時にスマートフォンがクラッシュしたり挙動がおかしくなったりする場合は、オンにしてみてください。</p>
<p style="line-height: 100%; margin-bottom: 0in">AndroidのJuggluco用設定から再びオフにできます。</p>
