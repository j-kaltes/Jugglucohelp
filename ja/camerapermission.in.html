<body lang="ja" dir="ltr"><h1>カメラ権限</h1>
<p>Sibionicsセンサーを使用するには、パッケージ上のデータマトリクスをスマートフォンのカメラでスキャンする必要があります。Jugglucoはこの読み取りに、Google Playサービス(この場合カメラ権限は不要)またはzXing(この場合カメラ権限が必要)のいずれかを使用します。</p>
