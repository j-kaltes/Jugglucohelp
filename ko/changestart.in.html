<body dir="ltr" lang="ko-KR"><h1>시작 변경</h1>
<p>LibreView로 데이터를 보내기 시작할 날짜와 시간을 변경합니다. 일부 데이터가 이미 LibreView에 있는 경우 유용할 수 있습니다. 예를 들어 미러 연결을 사용해 데이터를 다른 휴대전화로 옮긴 뒤, 그 새 휴대전화에서 LibreView로 데이터를 보낼 때 사용할 수 있습니다.</p>
