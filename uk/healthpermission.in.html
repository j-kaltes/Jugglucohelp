<body dir="ltr" lang="uk-UA"><h1>Дозвіл на запис <i>Глюкоза крові:</i></h1>
<p>Щоб записувати значення глюкози до <b>Health Connect,</b> користувач має надати Juggluco дозвіл записувати <b>Глюкоза крові:</b>
до Health Connect. 
</p>
<p>Цей дозвіл потрібен лише для отримання значень глюкози в Health Connect. У всіх інших аспектах Juggluco може працювати без нього.</p>
