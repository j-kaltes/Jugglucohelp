<body dir="ltr" lang="ko-KR"><h1 align="center">차단됨</h1>
<p style="margin-bottom: 0in"><span lang="en-US"><b>왼쪽 가운데 메뉴→미러→”</b></span><em><span lang="en-US"><b>미러가 입력값을 보냄”</b></span></em><span lang="en-US"> 이 설정되어 있으면 미러 연결에서 받은 입력값이 이 앱에서 입력한 값을 덮어쓰므로 이 앱에서 입력값을 입력할 수 없게 합니다.</span></p>
<p style="margin-bottom: 0in">이 앱이 미러 연결에서 입력값을 받지 않는다면 이 옵션을 끄십시오.</p>
<p style="margin-bottom: 0in">이 설정은 워치와 휴대전화 모두에서 왼쪽 메뉴→워치→Wear OS 설정→”워치에서 입력값 입력”을 통해서도 변경됩니다.</p>
