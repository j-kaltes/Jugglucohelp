<body lang="en-US" dir="ltr"><h1>Location permission</h1>
<p style="margin-bottom: 0cm">Devices running Android 6 to 11 need
location permission to find Bluetooth devices. This scanning for
Bluetooth devices is needed for <b>Sibionics</b>, <b>Aidex X</b> and
<b>Dexcom</b> sensors and to receive glucose measurement from
fingerstick glucose meters via Bluetooth.</p>
