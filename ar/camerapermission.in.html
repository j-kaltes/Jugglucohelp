<body dir="rtl" lang="ar"><h1>إذن الكاميرا</h1>
<p>لاستخدام مستشعر Sibionics، تحتاج إلى مسح مصفوفة بيانات موجودة على العبوة باستخدام كاميرا الهاتف. ويمكن لـ Juggluco أن يستخدم في ذلك إما خدمات Google Play، وعندها لا يحتاج Juggluco إلى إذن الكاميرا، أو أن يستخدم zXing، وعندها يحتاج Juggluco إلى إذن الكاميرا.</p>
