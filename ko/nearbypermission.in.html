<body dir="ltr" lang="ko-KR"><h1>주변 기기 권한</h1>
<p style="line-height: 100%; margin-bottom: 0in">Juggluco가 FreeStyle Libre 2 및 3 센서에서 Bluetooth로 혈당값을 받으려면 주변 기기 권한이 필요합니다. 다른 휴대전화나 워치에서 실행 중인 Juggluco로부터 이 혈당값을 받는 경우에는 이 권한이 필요하지 않습니다.</p>
<p style="line-height: 100%; margin-bottom: 0in">Juggluco는 워치 자체의 컴패니언 앱을 통해 워치에 연결하므로 워치에 연결하기 위해 Juggluco 자체에 이 권한이 필요한 것은 아닙니다.</p>
