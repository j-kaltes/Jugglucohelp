<body dir="rtl" lang="fa-IR"><p>برای در دسترس قرار دادن «مقدارها» از طریق وب‌سرور Nightscout داخلی Juggluco، گزینهٔ «ارسال مقدارها» را فعال کنید. پیش از آن باید برای هر برچسب تعیین کنید مقدارهایش با چه معنایی ارائه شوند. برچسب‌ها در «منوی چپ ← تنظیمات ← برچسب‌های مقدارها» ساخته، ویرایش یا حذف می‌شوند. (<a href="https://www.juggluco.nl/Jugglucohelp/labelhelp.html">Number Labels</a>)</p>
