<body dir="ltr" lang="ko-KR"><p>"입력값 <i>제공</i>"을 설정하면 Juggluco의 Nightscout 웹 서버를 통해 입력값에 접근할 수 있습니다. "입력값 <i>제공</i>"을 켜기 전에 각 레이블 아래 입력한 값을 어떤 방식으로 제공할지 레이블마다 지정해야 합니다. 레이블 자체는 왼쪽 메뉴→설정→"<a href="https://www.juggluco.nl/Jugglucohelp/labelhelp.html">입력값 레이블</a>"에서 만들고 수정하고 삭제할 수 있습니다.</p>
