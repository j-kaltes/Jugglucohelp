<body dir="ltr" lang="uk-UA"><h1>Початок зміни</h1>
<p>Змініть дату й час, починаючи з яких дані надсилатимуться до LibreView. Це корисно, коли частина даних уже є в LibreView, наприклад після перенесення даних на інший телефон через дзеркальне з’єднання, а потім використання нового телефона для надсилання даних до LibreView.</p>
