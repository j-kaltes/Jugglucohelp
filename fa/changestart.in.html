<body dir="rtl" lang="fa-IR"><h1>تغییر تاریخ آغاز</h1>
<p>تاریخ و زمانی را تغییر دهید که ارسال داده‌ها به LibreView از آن آغاز شود. این گزینه وقتی مفید است که بخشی از داده‌ها از قبل در LibreView باشند؛ مثلاً پس از انتقال داده‌ها به تلفن جدید از طریق آینه‌سازی و آغاز ارسال از همان تلفن.</p>
