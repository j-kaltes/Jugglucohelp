<body lang="ja" dir="ltr"><h1 align="center">ブロック中</h1>
<p style="margin-bottom: 0in"><span lang="ja"><b>中央左メニュー→ミラー→「</b></span><em><span lang="ja"><b>ミラーが記録を送信</b></span></em><span lang="ja"><b>」</b></span><span lang="ja">が設定されているため、このアプリでの記録入力はブロックされています。ミラー接続から受信した記録で上書きされてしまうためです。</span></p>
<p style="margin-bottom: 0in">このアプリがミラー接続から記録を受信していない場合は、このオプションをオフにしてください。</p>
<p style="margin-bottom: 0in">この設定は、ウォッチとスマートフォンの両方において、左メニュー→ウォッチ→WearOS設定→「記録の入力先(ウォッチ)」でも変更できます。</p>
