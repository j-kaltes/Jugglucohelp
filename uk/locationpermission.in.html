<body dir="ltr" lang="uk-UA"><h1>Дозвіл на місцезнаходження</h1>
<p style="margin-bottom: 0in">Пристроям з Android 6–11 потрібен дозвіл на місцезнаходження, щоб знаходити пристрої Bluetooth. Пошук Bluetooth-пристроїв потрібен для <b>Sibionics</b>, <b>Aidex X</b> і <b>Dexcom </b>, а також використовується Juggluco на Android 6, 7 і 7.1.</p>
